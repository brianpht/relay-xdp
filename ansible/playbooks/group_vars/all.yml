# Shared defaults across all environments.
# Override in group_vars/staging.yml or group_vars/production.yml.

# ---- Artifact / version ------------------------------------------------
relay_version: "v0.1.0-alpha.34"
github_repo: "brianpht/relay-xdp"
artifact_base_url: "https://github.com/{{ github_repo }}/releases/download/{{ relay_version }}"

# ---- Install paths -----------------------------------------------------
relay_bin_dir:    /usr/local/bin
relay_data_dir:   /opt/relay
relay_backup_dir: /opt/relay/backup
relay_conf_dir:   /etc/relay
relay_user:       relay
relay_group:      relay

# ---- Network -----------------------------------------------------------
relay_udp_port:         40000
relay_http_port:        8080
backend_http_port:      8090
backend_admin_http_port: 8091
server_backend_http_port: 8180
redis_port:             6379

# ---- NIC tuning for native XDP on AWS ENA ------------------------------
# ENA native XDP requires:
#   - MTU <= 3498 bytes (ENA hardware limit; default cloud-init MTU is 9001).
#   - combined queue count <= max/2 (driver allocates parallel XDP TX queues;
#     total RX+TX+XDP must not exceed device max). c5n.2xlarge / c6in.2xlarge
#     have max=8 combined queues, so 4 is the highest safe value.
# Without these settings the kernel returns EINVAL on BPF_LINK_CREATE for
# native XDP and relay-xdp falls back to xdpgeneric (SKB) mode (much slower).
relay_xdp_mtu: 3498
relay_xdp_combined_queues: 4

# ---- Kernel ------------------------------------------------------------
min_kernel_major: 6
min_kernel_minor: 5

# ---- Logging -----------------------------------------------------------
rust_log: info
rust_backtrace: 1

# ---- Timeouts / intervals ----------------------------------------------
relay_ping_interval_ms: 100
relay_update_interval_ms: 1000
relay_session_timeout_s: 60
# Graceful shutdown drain (seconds). Production must be 60 to give the backend
# a full update cycle to mark this relay offline. Staging overrides to 5s.
relay_shutdown_drain_secs: 60

# ---- Rolling deploy verification ---------------------------------------
relay_startup_wait_s: 5
relay_verify_retries: 3
relay_verify_delay_s: 3

