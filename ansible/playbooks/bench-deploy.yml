---
# playbooks/bench-deploy.yml
# Deploy bench_server binary to the bench node (game server simulator).
#
# The bench node simulates a production game server for relay-mode benchmarks:
#   bench_client -> relay-xdp:40000 -> bench_server:17777 -> relay-xdp -> bench_client
#
# server-backend mode:
#   bench_server self-registers with server-backend at startup when
#   SERVER_BACKEND_URL is set. bench_client uses BENCH_MODE=server-backend
#   and the exported server_backend_url stack output.
#
# Prerequisites:
#   - bench node provisioned via `cd infra && pulumi up --stack staging`
#   - binary built: `cargo build --release -p relay-bench`
#   - bench_servers group present in inventory (see ansible/inventory/staging.yml)
#
# Usage:
#   ansible-playbook -i inventory/staging.yml playbooks/bench-deploy.yml \
#     -e server_backend_url=http://<backend-public-ip>:8180
#
# After deploy, run the benchmark from your local machine:
#   eval $(python infra/stack_outputs.py --stack staging --format env)
#   # relay mode (legacy):
#   make bench-relay \
#     RELAY_ADDR=$(echo $RELAY_PUBLIC_IPS | awk '{print $1}'):40000 \
#     BACKEND_ADMIN=http://${BACKEND_HOST}:8091 \
#     BENCH_SERVER_HTTP=${BENCH_HOST}:18080 \
#     BENCH_SERVER_UDP=${BENCH_HOST}:17777
#   # server-backend mode:
#   make bench-relay \
#     BENCH_MODE=server-backend \
#     SERVER_BACKEND_URL=${SERVER_BACKEND_URL} \
#     SERVER_ID=<uuid-from-bench_server-log>

- name: Deploy bench_server to bench node
  hosts: bench_servers
  gather_facts: true
  become: yes

  vars:
    bench_http_port: 18080
    bench_udp_port:  17777
    bench_bin_dir:   /usr/local/bin
    # server-backend integration - override via -e or leave empty to disable
    server_backend_url:      "{{ lookup('env', 'SERVER_BACKEND_URL') | default('', true) }}"
    bench_server_lat:        "{{ lookup('env', 'BENCH_SERVER_LAT')   | default('39.0', true) }}"
    bench_server_lng:        "{{ lookup('env', 'BENCH_SERVER_LNG')   | default('-77.5', true) }}"

  tasks:
    # -- 1. Copy binary -------------------------------------------------------
    - name: Copy bench_server binary
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../target/release/bench_server"
        dest: "{{ bench_bin_dir }}/bench_server"
        mode: "0755"
      notify: Restart bench-server

    # -- 2. Install systemd unit ----------------------------------------------
    - name: Install bench-server systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/bench-server.service
        mode: "0644"
        content: |
          [Unit]
          Description=bench_server - relay-bench game server simulator
          Documentation=https://github.com/brianpht/relay-xdp/blob/main/relay-bench/README.md
          After=network.target

          [Service]
          ExecStart={{ bench_bin_dir }}/bench_server
          Environment=BENCH_HTTP_PORT={{ bench_http_port }}
          Environment=BENCH_UDP_PORT={{ bench_udp_port }}
          Environment=RUST_LOG=info
          {% if server_backend_url %}
          Environment=SERVER_BACKEND_URL={{ server_backend_url }}
          Environment=SERVER_LAT={{ bench_server_lat }}
          Environment=SERVER_LNG={{ bench_server_lng }}
          # SERVER_PUBLIC_ADDR MUST be the bench node's public EIP, not the
          # private IP. Relays sit in per-region VPCs separate from backend_net,
          # so traffic from bench_server reaches them via the public internet
          # (NAT'd to the EIP). PingTokenData.source_address baked into
          # SERVER_PING must match what the relay sees as the UDP source IP
          # (= EIP). Using the private IP causes SHA-256 verification to fail
          # and the relay never whitelists bench_server -> ROUTE_REQUEST gets
          # dropped on the last hop and the client never receives ROUTE_RESPONSE.
          Environment=SERVER_PUBLIC_ADDR={{ ansible_host }}:{{ bench_udp_port }}
          # SERVER_CALLBACK_URL: server-backend on backend_node calls this URL
          # to deliver the /notify_session webhook. backend_node + bench_node
          # are co-located in backend_net (same VPC), so private IP works and
          # avoids the EIP hairpin. sg_bench TCP 18080 ingress from vpc_cidr
          # gates this; see infra/network.py.
          Environment=SERVER_CALLBACK_URL=http://{{ ansible_default_ipv4.address }}:{{ bench_http_port }}
          {% endif %}
          Restart=on-failure
          RestartSec=2
          User=ubuntu

          [Install]
          WantedBy=multi-user.target
      notify: Restart bench-server

    # -- 3. Enable + start ----------------------------------------------------
    - name: Enable bench-server
      ansible.builtin.systemd:
        name: bench-server
        daemon_reload: true
        enabled: true

    # -- 4. Flush handlers (restart if binary or unit changed) ----------------
    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    # -- 5. Verify active -----------------------------------------------------
    - name: Verify bench-server is active
      ansible.builtin.command:
        cmd: systemctl is-active bench-server
      register: bench_svc
      changed_when: false
      failed_when: bench_svc.stdout != "active"

    - name: Report bench-server state
      ansible.builtin.debug:
        msg: >
          [bench-deploy] {{ inventory_hostname }} PASS:
          bench-server={{ bench_svc.stdout }}
          HTTP=:{{ bench_http_port }} UDP=:{{ bench_udp_port }}
          server_backend_url={{ server_backend_url | default('(disabled)') }}

  handlers:
    - name: Restart bench-server
      ansible.builtin.systemd:
        name: bench-server
        daemon_reload: true
        state: restarted

