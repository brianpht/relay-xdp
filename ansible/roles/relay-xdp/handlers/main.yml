---
# roles/relay-xdp/handlers/main.yml

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: restart relay-xdp
  ansible.builtin.systemd:
    name: relay-xdp
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"

# `Type=oneshot RemainAfterExit=yes` units must be `restarted` (not just
# `started`) to re-run ExecStart when the script or unit changes.
- name: restart relay-xdp-nic-tune
  ansible.builtin.systemd:
    name: relay-xdp-nic-tune
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"

