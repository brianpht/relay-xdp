[defaults]
inventory           = inventory/
roles_path          = roles/
remote_user         = ubuntu
private_key_file    = ~/.ssh/personal-key
# P1-05: host key checking is ON. First connection to each new host
# auto-accepts the key (via `accept-new` in ssh_args below) and writes it
# to ~/.ssh/known_hosts; subsequent connections verify. This protects
# against MITM after the first deploy without breaking automation.
host_key_checking   = True
retry_files_enabled = False
stdout_callback     = community.general.yaml
deprecation_warnings = False
interpreter_python  = /usr/bin/python3

[privilege_escalation]
become      = True
become_method = sudo

[ssh_connection]
pipelining  = True
# P1-05: do NOT use `StrictHostKeyChecking=no` + `UserKnownHostsFile=/dev/null`
# (accepts every key including a swapped-in attacker key). `accept-new`
# auto-accepts on first sight and persists the key, so subsequent connects
# detect MITM. ControlMaster reuse is preserved.
ssh_args    = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
