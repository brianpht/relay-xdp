config:
  relay-xdp-infra:relay_regions:
    - us-east-1
    - eu-west-1
    - ap-southeast-1
  relay-xdp-infra:relay_count: "3"
  relay-xdp-infra:relay_instance_type: c5n.xlarge
  relay-xdp-infra:backend_region: us-east-1
  relay-xdp-infra:backend_instance_type: c5.large
  relay-xdp-infra:key_pub_path: ~/.ssh/personal-key.pub
  # P1-04: production must explicitly narrow admin_cidr before `pulumi up`.
  # Override with `pulumi config set admin_cidr <YOUR_IP>/32 --stack production`.
  # `infra/config.py` and the `Makefile` preflight will both refuse to proceed
  # while this placeholder is in place.
  relay-xdp-infra:admin_cidr: REQUIRED_OVERRIDE

