[package]
name = "relay-backend"
version = "0.1.0"
license = "MIT"
edition = "2021"

[lib]
name = "relay_backend"
path = "src/lib.rs"

[[bin]]
name = "relay-backend"
path = "src/main.rs"

[dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }

# Redis
redis = { version = "1.2.0", features = ["tokio-comp"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"


# Crypto (NaCl box - decrypt relay-xdp update requests)
crypto_box = "0.9"
getrandom = "0.4.2"

# Bench mode: derive per-relay symmetric key + encrypt RouteToken for /bench_token
# (matches relay-xdp::config::derive_secret_key + relay-sdk::tokens::encrypt_route_token).
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
blake2 = "0.10"
rand = "0.8"
relay-xdp-common = { path = "../relay-xdp-common", features = ["user"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
env_logger = "0.11"
log = "0.4"
anyhow = "1"
num_cpus = "1"
lru = "0.16"  # P1-01: per-relay nonce LRU for /relay_update replay protection; >=0.16.3 fixes RUSTSEC-2026-0002 (IterMut Stacked Borrows unsoundness)

[dev-dependencies]
relay-xdp = { path = "../relay-xdp" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
crypto_box = "0.9"
getrandom = "0.4.2"
hex = "0.4"

