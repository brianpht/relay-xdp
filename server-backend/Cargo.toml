[package]
name = "server-backend"
version = "0.1.0"
license = "MIT"
edition = "2021"

[lib]
name = "server_backend"
path = "src/lib.rs"

[[bin]]
name = "server-backend"
path = "src/main.rs"

[dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }

# HTTP client (poll relay-backend /route_matrix + call /bench_token + webhook)
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
env_logger = "0.11"
log = "0.4"

# Route matrix parsing + RouteEntry types.
# relay-backend already has a lib.rs that exports route_matrix, optimizer, and encoding.
relay-backend = { path = "../relay-backend" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

