[package]
name = "relay-bench"
version = "0.1.0"
license = "MIT"
edition = "2021"
description = "Client/server benchmark harness for relay-xdp end-to-end load testing"

[[bin]]
name = "bench_server"
path = "src/bin/bench_server.rs"

[[bin]]
name = "bench_client"
path = "src/bin/bench_client.rs"

[dependencies]
relay-sdk        = { path = "../relay-sdk" }
relay-xdp-common = { path = "../relay-xdp-common" }

tokio      = { version = "1", features = ["full"] }
axum       = "0.8"
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rand       = "0.8"
hex        = "0.4"
log        = "0.4"
env_logger = "0.11"
reqwest    = { version = "0.12", features = ["json", "blocking"] }

